<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Countdown & Secret Word Search</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --grid-border: #334155;
      --found: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header { text-align: center; }
    header h1 { font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.9rem; }

    /* Grid Layout */
    .grid-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 6px;
      touch-action: none;
      user-select: none;
    }

    .cell {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid var(--grid-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .cell .coord-label {
      font-size: 0.55rem;
      color: var(--muted);
      position: absolute;
      top: 3px;
      left: 4px;
      font-weight: 600;
    }
    .cell .letter-val {
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      color: var(--text);
      margin-top: 6px;
    }
    .cell.prefilled { background: #0f172a; }
    .cell.prefilled .letter-val { color: #475569; }
    .cell.selected { background: #0284c7; }
    .cell.selected .letter-val { color: #fff; }
    .cell.found { background: var(--found); border-color: var(--found); }
    .cell.found .letter-val { color: #fff; }

    /* Stage 1 Dashboard */
    .stage-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stage-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .word-pill {
      background: #0f172a;
      border: 1px solid var(--grid-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--muted);
      transition: all 0.3s ease;
    }
    .word-pill.revealed {
      border-color: var(--found);
      color: var(--found);
      background: rgba(16, 185, 129, 0.1);
    }

    .unveil-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-gold);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .unveil-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--grid-border);
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title { font-size: 1.1rem; color: var(--accent); font-weight: 700; }
    .modal-body { font-size: 0.95rem; color: var(--text); line-height: 1.4; }
    .modal-close-btn {
      padding: 8px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }

    /* Stage 2 Secret Card */
    #stage2 {
      display: none;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--accent-gold);
    }
    .message-box {
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
      color: var(--text);
      padding: 12px 0;
    }
    .highlight-gold { color: var(--accent-gold); font-weight: 700; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Birthday Countdown Hunt</h1>
    <p>Tap blocks or highlight secret words in the grid</p>
  </header>

  <!-- Interactive Grid -->
  <div class="grid-container" id="grid"></div>

  <!-- Stage 1 Discovery Progress -->
  <div class="stage-card" id="stage1">
    <div class="stage-title">Stage 1: Words Discovered</div>
    <div class="word-list" id="wordList"></div>
    <button class="unveil-btn" id="unveilBtn" onclick="showStage2()">Unveil Secret Message</button>
  </div>

  <!-- Stage 2 Narrative Unveil -->
  <div class="stage-card" id="stage2">
    <div class="stage-title">Stage 2: The Reveal</div>
    <div class="message-box" id="finalMessage"></div>
  </div>
</div>

<!-- Block Interaction Modal Popup -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Block Info</div>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  // 9x9 Master Matrix Layout
  const masterGrid = [
    ['H','C','I','R','U','Z','Q','X','P'], // Row 1 (ZURICH backwards C1-C6)
    ['A','D','V','E','N','T','U','R','E'], // Row 2 (ADVENTURE forward C1-C9)
    ['L','I','N','D','T','S','M','B','O'], // Row 3 (LINDT forward C1-C5)
    ['Y','O','U','R','B','K','G','I','X'], // Row 4 (YOUR forward C1-C4)
    ['A','T','W','A','W','A','I','T','S'], // Row 5 (AT C1-C2, AWAITS C4-C8)
    ['R','Y','A','D','H','T','R','I','B'], // Row 6 (BIRTHDAY backwards C2-C9)
    ['S','W','I','S','S','C','L','U','B'], // Row 7 (SWISS forward C1-C5)
    ['E','T','A','L','O','C','O','H','C'], // Row 8 (CHOCOLATE backwards C1-C9)
    ['S','U','R','P','R','I','S','E','!']  // Row 9 (SURPRISE! forward C1-C9)
  ];

  // Pre-populated Decoy Tiles (18 tiles)
  const prefilledCoords = [
    "0,6","0,7","0,8", "2,5","2,6","2,7","2,8",
    "3,4","3,5","3,6","3,7","3,8", "4,2","4,8",
    "5,0", "6,5","6,6","6,7"
  ];

  // Target Words Definition
  const targetWords = [
    { id: "ZURICH", text: "ZURICH", coords: ["0,5","0,4","0,3","0,2","0,1","0,0"] },
    { id: "ADVENTURE", text: "ADVENTURE", coords: ["1,0","1,1","1,2","1,3","1,4","1,5","1,6","1,7","1,8"] },
    { id: "LINDT", text: "LINDT", coords: ["2,0","2,1","2,2","2,3","2,4"] },
    { id: "YOUR", text: "YOUR", coords: ["3,0","3,1","3,2","3,3"] },
    { id: "AWAITS", text: "AWAITS", coords: ["4,3","4,4","4,5","4,6","4,7"] },
    { id: "BIRTHDAY", text: "BIRTHDAY", coords: ["5,8","5,7","5,6","5,5","5,4","5,3","5,2","5,1"] },
    { id: "SWISS", text: "SWISS", coords: ["6,0","6,1","6,2","6,3","6,4"] },
    { id: "CHOCOLATE", text: "CHOCOLATE", coords: ["7,8","7,7","7,6","7,5","7,4","7,3","7,2","7,1","7,0"] },
    { id: "SURPRISE", text: "SURPRISE!", coords: ["8,0","8,1","8,2","8,3","8,4","8,5","8,6","8,7","8,8"] }
  ];

  let selectedCells = [];
  let foundWords = new Set();
  let isSelecting = false;

  function init() {
    renderGrid();
    renderStage1();
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';

    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const coord = `${r},${c}`;
        const label = `R${r + 1}C${c + 1}`;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.coord = coord;
        cell.dataset.label = label;

        const labelSpan = document.createElement('span');
        labelSpan.className = 'coord-label';
        labelSpan.textContent = label;

        const valSpan = document.createElement('span');
        valSpan.className = 'letter-val';
        valSpan.textContent = masterGrid[r][c];

        if (prefilledCoords.includes(coord)) {
          cell.classList.add('prefilled');
        }

        cell.appendChild(labelSpan);
        cell.appendChild(valSpan);

        // Word search selection listeners
        cell.addEventListener('mousedown', () => startSelection(coord));
        cell.addEventListener('mouseenter', () => updateSelection(coord));
        cell.addEventListener('mouseup', endSelection);

        // Tap/Click for Modal Info Popup
        cell.addEventListener('click', (e) => {
          if (selectedCells.length <= 1) {
            openModal(label, masterGrid[r][c], prefilledCoords.includes(coord));
          }
        });

        gridEl.appendChild(cell);
      }
    }
    highlightFoundCells();
  }

  function startSelection(coord) {
    isSelecting = true;
    selectedCells = [coord];
    updateCellStyles();
  }

  function updateSelection(coord) {
    if (!isSelecting) return;
    if (!selectedCells.includes(coord)) {
      selectedCells.push(coord);
      updateCellStyles();
    }
  }

  function endSelection() {
    if (!isSelecting) return;
    isSelecting = false;
    checkSelectedWord();
  }

  function updateCellStyles() {
    document.querySelectorAll('.cell').forEach(cell => {
      const coord = cell.dataset.coord;
      if (selectedCells.includes(coord)) {
        cell.classList.add('selected');
      } else {
        cell.classList.remove('selected');
      }
    });
  }

  function checkSelectedWord() {
    targetWords.forEach(word => {
      if (foundWords.has(word.id)) return;
      
      const forwardMatch = word.coords.every((val, idx) => val === selectedCells[idx]);
      const reverseMatch = word.coords.slice().reverse().every((val, idx) => val === selectedCells[idx]);

      if ((forwardMatch || reverseMatch) && selectedCells.length === word.coords.length) {
        foundWords.add(word.id);
      }
    });

    setTimeout(() => {
      selectedCells = [];
      updateCellStyles();
      highlightFoundCells();
      renderStage1();
    }, 150);
  }

  function highlightFoundCells() {
    targetWords.forEach(word => {
      if (foundWords.has(word.id)) {
        word.coords.forEach(coord => {
          const cell = document.querySelector(`[data-coord="${coord}"]`);
          if (cell) cell.classList.add('found');
        });
      }
    });
  }

  function renderStage1() {
    const listEl = document.getElementById('wordList');
    listEl.innerHTML = '';

    targetWords.forEach(word => {
      const pill = document.createElement('div');
      pill.className = 'word-pill';
      
      if (foundWords.has(word.id)) {
        pill.classList.add('revealed');
        pill.textContent = word.text;
      } else {
        pill.textContent = '? '.repeat(word.text.replace('!','').length).trim();
      }
      listEl.appendChild(pill);
    });

    const unveilBtn = document.getElementById('unveilBtn');
    if (foundWords.size === targetWords.length) {
      unveilBtn.classList.add('active');
    } else {
      unveilBtn.classList.remove('active');
    }
  }

  function openModal(label, letter, isDecoy) {
    document.getElementById('modalTitle').textContent = `Block ${label}`;
    document.getElementById('modalBody').innerHTML = `
      Letter: <strong>${letter}</strong><br/>
      Status: ${isDecoy ? '<em>Pre-filled Decoy Tile</em>' : '<em>Active Grid Letter</em>'}
    `;
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function showStage2() {
    document.getElementById('stage1').style.display = 'none';
    const stage2 = document.getElementById('stage2');
    stage2.style.display = 'flex';

    document.getElementById('finalMessage').innerHTML = `
      YOUR <span class="highlight-gold">SWISS</span> BIRTHDAY ADVENTURE AWAITS!<br/><br/>
      Get ready for <span class="highlight-gold">LINDT</span> CHOCOLATE, breathtaking views, and a special <span class="highlight-gold">ZURICH</span> SURPRISE! 🇨🇭✨
    `;
  }

  init();
</script>
</body>
</html>
