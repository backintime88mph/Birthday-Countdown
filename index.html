<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Countdown & Secret Word Search</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-gold: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --grid-border: #334155;
      --found: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header { text-align: center; }
    header h1 { font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 6px; }
    header p { color: var(--muted); font-size: 0.9rem; }

    .day-selector {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 12px;
      gap: 4px;
    }
    .day-btn {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .day-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Grid Layout */
    .grid-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 6px;
      touch-action: none;
      user-select: none;
    }

    .cell {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid var(--grid-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .cell.prefilled { color: #475569; background: #0f172a; }
    .cell.selected { background: #0284c7; color: #fff; }
    .cell.found { background: var(--found); color: #fff; border-color: var(--found); }

    /* Stage 1 Dashboard */
    .stage-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stage-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .word-pill {
      background: #0f172a;
      border: 1px solid var(--grid-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--muted);
      transition: all 0.3s ease;
    }
    .word-pill.revealed {
      border-color: var(--found);
      color: var(--found);
      background: rgba(16, 185, 129, 0.1);
    }

    .unveil-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-gold);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .unveil-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Stage 2 Secret Card */
    #stage2 {
      display: none;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--accent-gold);
    }
    .message-box {
      font-size: 1.1rem;
      line-height: 1.6;
      text-align: center;
      color: var(--text);
      padding: 12px 0;
    }
    .highlight-gold { color: var(--accent-gold); font-weight: 700; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Birthday Countdown Hunt</h1>
    <p>Select a day to unlock new tokens & discover secret words</p>
  </header>

  <div class="day-selector" id="daySelector">
    <button class="day-btn active" onclick="loadDay(1)">Day 1</button>
    <button class="day-btn" onclick="loadDay(2)">Day 2</button>
    <button class="day-btn" onclick="loadDay(3)">Day 3</button>
    <button class="day-btn" onclick="loadDay(4)">Day 4</button>
    <button class="day-btn" onclick="loadDay(5)">Day 5</button>
    <button class="day-btn" onclick="loadDay(6)">Day 6</button>
    <button class="day-btn" onclick="loadDay(7)">Day 7</button>
  </div>

  <!-- Interactive Grid -->
  <div class="grid-container" id="grid"></div>

  <!-- Stage 1 Discovery Progress -->
  <div class="stage-card" id="stage1">
    <div class="stage-title">Stage 1: Words Discovered</div>
    <div class="word-list" id="wordList"></div>
    <button class="unveil-btn" id="unveilBtn" onclick="showStage2()">Unveil Secret Message</button>
  </div>

  <!-- Stage 2 Narrative Unveil -->
  <div class="stage-card" id="stage2">
    <div class="stage-title">Stage 2: The Reveal</div>
    <div class="message-box" id="finalMessage"></div>
  </div>
</div>

<script>
  // 9x9 Master Matrix Layout
  const masterGrid = [
    ['H','C','I','R','U','Z','Q','X','P'], // Row 1 (ZURICH backwards C1-C6)
    ['A','D','V','E','N','T','U','R','E'], // Row 2 (ADVENTURE forward C1-C9)
    ['L','I','N','D','T','S','M','B','O'], // Row 3 (LINDT forward C1-C5)
    ['Y','O','U','R','B','K','G','I','X'], // Row 4 (YOUR forward C1-C4)
    ['A','T','W','A','W','A','I','T','S'], // Row 5 (AT C1-C2, AWAITS C4-C8)
    ['R','Y','A','D','H','T','R','I','B'], // Row 6 (BIRTHDAY backwards C2-C9)
    ['S','W','I','S','S','C','L','U','B'], // Row 7 (SWISS forward C1-C5)
    ['E','T','A','L','O','C','O','H','C'], // Row 8 (CHOCOLATE backwards C1-C9)
    ['S','U','R','P','R','I','S','E','!']  // Row 9 (SURPRISE! forward C1-C9)
  ];

  // Pre-populated Decoy Tiles (18 tiles)
  const prefilledCoords = [
    "0,6","0,7","0,8", "2,5","2,6","2,7","2,8",
    "3,4","3,5","3,6","3,7","3,8", "4,2","4,8",
    "5,0", "6,5","6,6","6,7"
  ];

  // Daily Token Releases
  const dailyTokens = {
    1: ["0,0","0,1","1,4","1,5","3,2","4,4","5,3","7,4","8,2"],
    2: ["1,6","3,1","4,0","4,7","5,4","6,2","7,3","7,7","8,1"],
    3: ["1,7","3,3","4,1","4,6","5,5","6,3","7,2","7,8","8,0"],
    4: ["0,2","1,8","3,0","5,6","6,4","7,1","7,6","8,4","8,8"],
    5: ["0,3","3,4","4,5","5,2","5,7","7,0","7,5","8,5","8,7"],
    6: ["0,4","4,8","5,1","5,8","6,1","8,3","8,6","7,7","0,6"],
    7: ["0,5","1,0","1,1","1,2","1,3","2,0","2,1","2,2","2,3","2,4","4,3","6,0"]
  };

  // Target Words Definition
  const targetWords = [
    { id: "ZURICH", text: "ZURICH", coords: ["0,5","0,4","0,3","0,2","0,1","0,0"] },
    { id: "ADVENTURE", text: "ADVENTURE", coords: ["1,0","1,1","1,2","1,3","1,4","1,5","1,6","1,7","1,8"] },
    { id: "LINDT", text: "LINDT", coords: ["2,0","2,1","2,2","2,3","2,4"] },
    { id: "YOUR", text: "YOUR", coords: ["3,0","3,1","3,2","3,3"] },
    { id: "AWAITS", text: "AWAITS", coords: ["4,3","4,4","4,5","4,6","4,7"] },
    { id: "BIRTHDAY", text: "BIRTHDAY", coords: ["5,8","5,7","5,6","5,5","5,4","5,3","5,2","5,1"] },
    { id: "SWISS", text: "SWISS", coords: ["6,0","6,1","6,2","6,3","6,4"] },
    { id: "CHOCOLATE", text: "CHOCOLATE", coords: ["7,8","7,7","7,6","7,5","7,4","7,3","7,2","7,1","7,0"] },
    { id: "SURPRISE", text: "SURPRISE!", coords: ["8,0","8,1","8,2","8,3","8,4","8,5","8,6","8,7","8,8"] }
  ];

  let currentDay = 1;
  let selectedCells = [];
  let foundWords = new Set();
  let isSelecting = false;

  function init() {
    renderGrid();
    renderStage1();
  }

  function getUnlockedCoords(day) {
    let unlocked = new Set(prefilledCoords);
    for (let d = 1; d <= day; d++) {
      if (dailyTokens[d]) {
        dailyTokens[d].forEach(coord => unlocked.add(coord));
      }
    }
    return unlocked;
  }

  function loadDay(day) {
    currentDay = day;
    document.querySelectorAll('.day-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', idx + 1 === day);
    });
    selectedCells = [];
    renderGrid();
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    const unlocked = getUnlockedCoords(currentDay);

    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const coord = `${r},${c}`;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.coord = coord;

        if (unlocked.has(coord)) {
          cell.textContent = masterGrid[r][c];
          if (prefilledCoords.includes(coord)) {
            cell.classList.add('prefilled');
          }
        } else {
          cell.textContent = '';
        }

        // Selection Interaction
        cell.addEventListener('mousedown', () => startSelection(coord));
        cell.addEventListener('mouseenter', () => updateSelection(coord));
        cell.addEventListener('mouseup', endSelection);

        gridEl.appendChild(cell);
      }
    }
    highlightFoundCells();
  }

  function startSelection(coord) {
    isSelecting = true;
    selectedCells = [coord];
    updateCellStyles();
  }

  function updateSelection(coord) {
    if (!isSelecting) return;
    if (!selectedCells.includes(coord)) {
      selectedCells.push(coord);
      updateCellStyles();
    }
  }

  function endSelection() {
    if (!isSelecting) return;
    isSelecting = false;
    checkSelectedWord();
  }

  function updateCellStyles() {
    document.querySelectorAll('.cell').forEach(cell => {
      const coord = cell.dataset.coord;
      if (selectedCells.includes(coord)) {
        cell.classList.add('selected');
      } else {
        cell.classList.remove('selected');
      }
    });
  }

  function checkSelectedWord() {
    targetWords.forEach(word => {
      if (foundWords.has(word.id)) return;
      
      const forwardMatch = word.coords.every((val, idx) => val === selectedCells[idx]);
      const reverseMatch = word.coords.slice().reverse().every((val, idx) => val === selectedCells[idx]);

      if ((forwardMatch || reverseMatch) && selectedCells.length === word.coords.length) {
        foundWords.add(word.id);
      }
    });

    selectedCells = [];
    updateCellStyles();
    highlightFoundCells();
    renderStage1();
  }

  function highlightFoundCells() {
    targetWords.forEach(word => {
      if (foundWords.has(word.id)) {
        word.coords.forEach(coord => {
          const cell = document.querySelector(`[data-coord="${coord}"]`);
          if (cell) cell.classList.add('found');
        });
      }
    });
  }

  function renderStage1() {
    const listEl = document.getElementById('wordList');
    listEl.innerHTML = '';

    targetWords.forEach(word => {
      const pill = document.createElement('div');
      pill.className = 'word-pill';
      
      if (foundWords.has(word.id)) {
        pill.classList.add('revealed');
        pill.textContent = word.text;
      } else {
        // Masked placeholder state
        pill.textContent = '? '.repeat(word.text.replace('!','').length).trim();
      }
      listEl.appendChild(pill);
    });

    // Enable Stage 2 button once all words are found
    const unveilBtn = document.getElementById('unveilBtn');
    if (foundWords.size === targetWords.length) {
      unveilBtn.classList.add('active');
    } else {
      unveilBtn.classList.remove('active');
    }
  }

  function showStage2() {
    document.getElementById('stage1').style.display = 'none';
    const stage2 = document.getElementById('stage2');
    stage2.style.display = 'flex';

    document.getElementById('finalMessage').innerHTML = `
      YOUR <span class="highlight-gold">SWISS</span> BIRTHDAY ADVENTURE AWAITS!<br/><br/>
      Get ready for <span class="highlight-gold">LINDT</span> CHOCOLATE, breathtaking views, and a special <span class="highlight-gold">ZURICH</span> SURPRISE! 🇨🇭✨
    `;
  }

  init();
</script>
</body>
</html>
